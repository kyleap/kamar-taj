<title>古一法師 × Kyle 修行紀錄</title>
<style>
:root{--bg:#0b0806;--panel:rgba(22,14,9,.88);--text:#f4e9dc;--muted:#b49a80;--border:rgba(255,138,31,.28);--accent:#ff8a1f;--accent2:#ffc069;--err:#ff6b4a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--text);
background:radial-gradient(700px 500px at 50% 0%,rgba(255,120,20,.22),transparent 65%),radial-gradient(600px 400px at 100% 100%,rgba(180,60,10,.25),transparent 60%),var(--bg);overflow-x:hidden}
.ring{position:fixed;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;border-radius:50%;pointer-events:none;opacity:.12;
background:repeating-conic-gradient(from 0deg,rgba(255,138,31,.9) 0 2deg,transparent 2deg 12deg);-webkit-mask:radial-gradient(circle,transparent 30%,#000 31%,#000 33%,transparent 34%,transparent 44%,#000 45%,#000 46%,transparent 47%);mask:radial-gradient(circle,transparent 30%,#000 31%,#000 33%,transparent 34%,transparent 44%,#000 45%,#000 46%,transparent 47%);animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.box{position:relative;width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:28px 22px 22px;box-shadow:0 0 0 1px rgba(255,138,31,.08),0 0 60px rgba(255,120,20,.18),0 20px 50px rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.sigil{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;border:3px dashed var(--accent);box-shadow:0 0 18px rgba(255,138,31,.7),inset 0 0 14px rgba(255,138,31,.5);display:flex;align-items:center;justify-content:center;animation:spin 14s linear infinite}
.sigil i{width:36px;height:36px;border-radius:50%;border:2px solid var(--accent2);box-shadow:0 0 10px rgba(255,192,105,.8)}
h1{margin:0 0 10px;font-size:1.3rem;text-align:center;letter-spacing:.06em;color:var(--accent2);text-shadow:0 0 12px rgba(255,138,31,.55)}
p.sub{margin:0 0 20px;color:var(--muted);font-size:.92rem;line-height:1.65;text-align:center}
label.f{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.pw{display:flex;gap:8px}
input[type=password],input[type=text]{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:rgba(0,0,0,.45);color:var(--text);font-size:16px;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,138,31,.25)}
.eye{border:1px solid var(--border);background:rgba(0,0,0,.45);color:var(--text);border-radius:12px;padding:0 12px;cursor:pointer;font-size:16px}
.rem{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:.86rem;cursor:pointer;color:var(--text)}
.rem input{width:18px;height:18px;accent-color:var(--accent);flex:none}
button.go{width:100%;padding:13px;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;letter-spacing:.2em;color:#1a0d03;cursor:pointer;background:linear-gradient(135deg,#ffc069,#ff8a1f 55%,#e85d04);box-shadow:0 0 18px rgba(255,138,31,.45)}
button.go:disabled{opacity:.6;cursor:progress}
.msg{min-height:1.4em;margin-top:12px;font-size:.88rem;color:var(--err);text-align:center}
.msg.info{color:var(--muted)}
.foot{margin-top:16px;font-size:.72rem;color:var(--muted);line-height:1.5;opacity:.8;text-align:center}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.ring,.sigil{animation:none}}
</style>
</head>

<div class="ring" aria-hidden="true"></div>
<form class="box" id="f" autocomplete="off">

  <h1>古一法師 × Kyle 修行紀錄</h1>
  <p class="sub">Kyle，卡瑪泰姬的大門只為肯流汗的人開啟。<br>報上通關密語。今日的功課未了，就別妄想離開這座聖殿。</p>
  <label class="f" for="pw">通關密語</label>
  <div class="pw"><input type="password" id="pw" autocomplete="current-password" required autofocus><button type="button" class="eye" id="eye" aria-label="顯示密語">👁</button></div>
  <label class="rem"><input type="checkbox" id="rem"> 記住此裝置（只保存解鎖金鑰，不保存密語）</label>
  <button class="go" id="go" type="submit">解鎖</button>
  <div class="msg" id="msg" role="alert"></div>
  <div class="foot">🔐 內容以 AES-256-GCM 加密；金鑰在你的瀏覽器中以 PBKDF2-SHA256（600,000 次）衍生，伺服器上只有密文。</div>
  <noscript><p class="msg">請啟用 JavaScript 以開啟此紀錄。</p></noscript>
</form>

const KS="kamartaj-device-key-v1";
const OUTRO="\n<div id=\"kt-logout\" style=\"position:fixed;right:10px;top:10px;z-index:2147483000\">\n<button type=\"button\" onclick=\"try{localStorage.removeItem('kamartaj-device-key-v1')}catch(e){};location.reload()\" style=\"font:12px -apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC',sans-serif;padding:5px 9px;border-radius:999px;border:1px solid rgba(127,127,127,.35);background:rgba(127,127,127,.15);color:inherit;backdrop-filter:blur(6px);cursor:pointer;opacity:.7\">\ud83d\udd12 \u767b\u51fa<\/button>\n<\/div>\n";
const $=id=>document.getElementById(id);
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=b=>{let s="";const a=new Uint8Array(b);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const msg=(t,info)=>{const m=$("msg");m.textContent=t;m.className="msg"+(info?" info":"")};
if(!(window.crypto&&crypto.subtle)){msg("此瀏覽器不支援 WebCrypto，請改用最新版 Chrome／Safari／Edge／Firefox，並以 https 開啟。");$("go").disabled=true;return}
async function openWith(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(P.iv)},key,ub(P.ct));
  return new TextDecoder("utf-8").decode(pt);
}
// 解析中途呼叫 document.open 會把內容疊到舊頁面上，故先等 DOMContentLoaded
const ready=new Promise(r=>{const go=()=>setTimeout(r,0);document.readyState==="loading"?document.addEventListener("DOMContentLoaded",go,{once:true}):go()});
async function reveal(html){
  await ready;
  const i=html.lastIndexOf("</body>");
  html=i>=0?html.slice(0,i)+OUTRO+html.slice(i):html+OUTRO;
  document.open();document.write(html);document.close();
}
async function deriveRaw(secret){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(secret),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:ub(P.salt),iterations:P.iter},base,256);
}
const imp=raw=>crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"]);
// 記住此裝置：salt 相同才嘗試自動解鎖；否則安靜退回輸入頁
(async()=>{
  let s=null;try{s=JSON.parse(localStorage.getItem(KS)||"null")}catch(e){}
  if(!s)return;
  if(s.salt!==P.salt||!s.key){try{localStorage.removeItem(KS)}catch(e){}return}
  try{msg("以已記住的裝置金鑰開門中…",true);await reveal(await openWith(await imp(ub(s.key))))}
  catch(e){try{localStorage.removeItem(KS)}catch(_){};msg("")}
})();
$("eye").onclick=()=>{const p=$("pw");p.type=p.type==="password"?"text":"password"};
$("f").addEventListener("submit",async e=>{
  e.preventDefault();const secret=$("pw").value;if(!secret)return;
  $("go").disabled=true;msg("結印中…",true);
  try{
    const raw=await deriveRaw(secret);
    const html=await openWith(await imp(raw));
    if($("rem").checked){try{localStorage.setItem(KS,JSON.stringify({salt:P.salt,key:bu(raw)}))}catch(e){}}
    else{try{localStorage.removeItem(KS)}catch(e){}}
    await reveal(html);
